name: Workflow - CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Workflow - CI
    runs-on: ubuntu-latest
    env:
      FURIN_SYNC_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FURIN_SYNC_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Lint & Format Check
        run: bun run ultracite check

      - name: Build
        run: bun run build

      - name: Type Check
        run: bun run tscheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: Fetch main branch
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch origin main
          git branch main origin/main

      - name: React Doctor (main)
        if: github.ref == 'refs/heads/main'
        run: bunx react-doctor -y --annotations

      - name: React Doctor (PR)
        if: github.ref != 'refs/heads/main'
        run: bunx react-doctor -y --diff main --annotations

      - name: Publish Preview
        working-directory: packages/core
        if: github.event_name == 'pull_request'
        run: bunx pkg-pr-new publish
