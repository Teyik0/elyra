name: Workflow - CD

on:
  release:
    types: [published]

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Workflow - CD
    runs-on: ubuntu-latest
    env:
      FURIN_SYNC_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      FURIN_SYNC_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: Cache bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: "Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Lint & Format Check
        run: bun run ultracite check

      - name: Build
        run: bun run build

      - name: Type Check
        run: bun run tscheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: React Doctor
        run: bunx react-doctor --diff false

      - name: Setup auth for Bun
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc

      - name: Publish core
        working-directory: packages/core
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish PostgreSQL adapter
        working-directory: packages/sync-postgres
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Redis adapter
        working-directory: packages/sync-redis
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
